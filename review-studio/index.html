  <!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Studio</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --soft: #f0f2f5;
      --line: #e3e8ef;
      --line-strong: #cfd7e3;
      --text: #1f2937;
      --muted: #667085;
      --accent: #2563eb;
      --accent-soft: #e8f0ff;
      --success: #16a34a;
      --danger: #dc2626;
      --shadow: 0 14px 36px rgba(15, 23, 42, 0.06);
      --radius-xl: 22px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 10px;
      --mono: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
      --sans: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
    }

    .app {
      width: min(1360px, calc(100vw - 32px));
      margin: 16px auto;
      display: grid;
      grid-template-columns: minmax(400px, 0.95fr) minmax(420px, 1.05fr);
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .title-wrap {
      display: grid;
      gap: 6px;
    }

    .title-wrap h1,
    .title-wrap h2,
    p {
      margin: 0;
    }

    .title-wrap h1,
    .title-wrap h2 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .title-wrap p {
      color: var(--muted);
      font-size: 13px;
    }

    .panel-body {
      padding: 16px;
      display: grid;
      gap: 14px;
    }

    .block {
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: #fff;
      overflow: hidden;
    }

    .block-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .block-head strong {
      font-size: 14px;
    }

    .block-body {
      padding: 14px 16px 16px;
      display: grid;
      gap: 12px;
    }

    .row,
    .grid-2,
    .grid-3 {
      display: grid;
      gap: 12px;
    }

    .grid-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      background: #fff;
      color: var(--text);
      font: inherit;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }

    textarea {
      min-height: 98px;
      resize: vertical;
      line-height: 1.65;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button,
    .link-button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 999px;
      padding: 9px 14px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 140ms ease;
    }

    button:hover,
    .link-button:hover {
      border-color: var(--line-strong);
      background: var(--soft);
    }

    .primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .primary:hover {
      background: #1d4ed8;
      border-color: #1d4ed8;
    }

    .soft {
      background: var(--accent-soft);
      border-color: #cfe0ff;
      color: var(--accent);
    }

    .danger {
      color: var(--danger);
      background: #fff;
    }

    .status {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12px;
    }

    .problems {
      display: grid;
      gap: 12px;
    }

    .problem-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: #fff;
    }

    .problem-top {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .problem-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .problem-tag {
      min-width: 34px;
      height: 34px;
      padding: 0 10px;
      border-radius: 10px;
      background: var(--soft);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      font-weight: 700;
      color: var(--accent);
    }

    .problem-name-view {
      font-size: 14px;
      font-weight: 600;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .problem-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .problem-body {
      padding: 12px 14px 14px;
      display: grid;
      gap: 10px;
    }

    .preview-panel {
      min-height: calc(100vh - 32px);
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    .code {
      margin: 0 16px 16px;
      border: 1px solid #18212f;
      border-radius: 18px;
      overflow: hidden;
      background: #0f172a;
    }

    .code textarea {
      min-height: calc(100vh - 220px);
      border: none;
      border-radius: 0;
      background: transparent;
      color: #dbe5f5;
      padding: 18px;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.72;
    }

    .code textarea:focus {
      box-shadow: none;
    }

    .inline-tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cf-links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .muted {
      color: var(--muted);
      font-size: 12px;
    }

    .import-banner {
      display: none;
      padding: 12px 14px;
      border: 1px solid #cfe0ff;
      border-radius: var(--radius-md);
      background: #eef4ff;
      color: #1e40af;
      font-size: 13px;
    }

    .import-banner.show {
      display: block;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      padding: 10px 14px;
      background: rgba(15, 23, 42, 0.94);
      color: #fff;
      border-radius: 12px;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 140ms ease, transform 140ms ease;
      font-size: 12px;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 1120px) {
      .app {
        grid-template-columns: 1fr;
      }

      .preview-panel {
        min-height: 0;
      }

      .code textarea {
        min-height: 520px;
      }
    }

    @media (max-width: 760px) {
      .app {
        width: min(100vw - 12px, 100%);
        margin: 6px auto;
      }

      .grid-2,
      .grid-3 {
        grid-template-columns: 1fr;
      }

      .panel-header,
      .panel-body,
      .block-head,
      .block-body {
        padding-inline: 12px;
      }

      .code {
        margin-inline: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="panel">
      <div class="panel-header">
        <div class="title-wrap">
          <h1>Review Studio</h1>
          <p>写题解，生 Markdown。</p>
        </div>
        <div class="toolbar">
          <button id="load-sample" type="button">示例</button>
          <button id="reset-all" class="danger" type="button">清空</button>
        </div>
      </div>
      <div class="panel-body">
        <section class="block">
          <div class="block-head">
            <strong>Codeforces</strong>
          </div>
          <div class="block-body">
            <div id="import-banner" class="import-banner">已从 Codeforces 导入比赛信息。</div>
            <div class="grid-2">
              <div class="field">
                <label for="cf-url">Contest URL</label>
                <input id="cf-url" placeholder="https://codeforces.com/group/.../contest/...">
              </div>
              <div class="field">
                <label for="problem-seed">批量题号</label>
                <input id="problem-seed" placeholder="例如：7A,7B,7C 或 A,B,C,D">
              </div>
            </div>
            <div class="cf-links">
              <a class="link-button soft" href="https://codeforces.com/enter" target="_blank" rel="noreferrer">登录 CF</a>
              <a class="link-button" href="https://codeforces.com/group" target="_blank" rel="noreferrer">打开 Group</a>
              <button id="open-contest" type="button">打开比赛</button>
              <button id="apply-contest" class="primary" type="button">套用链接</button>
              <button id="seed-problems" type="button">批量建题</button>
            </div>
            <div class="muted" id="cf-note">静态页面不能安全地内嵌 CF 登录态，但可以快速跳转、回填标题和批量生成题目卡片。</div>
          </div>
        </section>

        <section class="block">
          <div class="block-head">
            <strong>文章</strong>
          </div>
          <div class="block-body">
            <div class="grid-2">
              <div class="field">
                <label for="post-title">标题</label>
                <input id="post-title" placeholder="⌈25暑训⌋ 第7,8场补题">
              </div>
              <div class="field">
                <label for="post-date">日期</label>
                <input id="post-date" placeholder="YYYY-MM-DD HH:mm:ss">
              </div>
            </div>
            <div class="grid-2">
              <div class="field">
                <label for="post-tags">标签</label>
                <input id="post-tags" placeholder="26春训">
              </div>
              <div class="field">
                <label for="post-category">分类</label>
                <input id="post-category" placeholder="算法竞赛">
              </div>
            </div>
            <div class="field">
              <label for="post-excerpt">摘要</label>
              <textarea id="post-excerpt" placeholder="开头那段话"></textarea>
            </div>
          </div>
        </section>

        <section class="block">
          <div class="block-head">
            <strong>题目</strong>
            <div class="inline-tools">
              <button id="add-problem" class="primary" type="button">新增题目</button>
              <button id="save-draft" type="button">保存草稿</button>
            </div>
          </div>
          <div class="block-body">
            <div id="problem-list" class="problems"></div>
          </div>
        </section>
      </div>
    </section>

    <section class="panel preview-panel">
      <div class="panel-header">
        <div class="title-wrap">
          <h2>Markdown</h2>
          <p>右侧只读，可复制或下载。</p>
        </div>
        <div class="toolbar">
          <button id="copy-markdown" class="primary" type="button">复制</button>
          <button id="save-post" class="soft" type="button">保存到 _posts</button>
          <button id="save-open-post" type="button">保存并打开 Typora</button>
          <button id="download-markdown" type="button">下载</button>
        </div>
      </div>
      <div class="panel-body" style="padding-top: 12px; padding-bottom: 12px;">
        <div class="status">
          <span id="problem-count">题目数：0</span>
          <span id="char-count">字符数：0</span>
          <span id="save-status">状态：未保存</span>
        </div>
      </div>
      <div class="code">
        <textarea id="markdown-output" readonly spellcheck="false"></textarea>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>

  <template id="problem-template">
    <article class="problem-card">
      <div class="problem-top">
        <div class="problem-title">
          <div class="problem-tag problem-badge">A</div>
          <div class="problem-name-view problem-heading">A</div>
        </div>
        <div class="problem-actions">
          <button class="move-up" type="button">上移</button>
          <button class="move-down" type="button">下移</button>
          <button class="remove-problem danger" type="button">删除</button>
        </div>
      </div>
      <div class="problem-body">
        <div class="grid-3">
          <div class="field">
            <label>编号</label>
            <input class="problem-label" placeholder="7A">
          </div>
          <div class="field">
            <label>题目名</label>
            <input class="problem-name" placeholder="可空">
          </div>
          <div class="field">
            <label>知识点</label>
            <input class="problem-tags" placeholder="dp、图论">
          </div>
        </div>
        <div class="field">
          <label>难度 / 备注</label>
          <input class="problem-note" placeholder="可空">
        </div>
      </div>
    </article>
  </template>

  <script>
    const STORAGE_KEY = "review-studio-draft-v2";
    const problemList = document.getElementById("problem-list");
    const output = document.getElementById("markdown-output");
    const toast = document.getElementById("toast");
    const postTitle = document.getElementById("post-title");
    const postDate = document.getElementById("post-date");
    const postTags = document.getElementById("post-tags");
    const postCategory = document.getElementById("post-category");
    const postExcerpt = document.getElementById("post-excerpt");
    const problemCount = document.getElementById("problem-count");
    const charCount = document.getElementById("char-count");
    const saveStatus = document.getElementById("save-status");
    const cfUrl = document.getElementById("cf-url");
    const problemSeed = document.getElementById("problem-seed");
    const importBanner = document.getElementById("import-banner");

    const defaultState = {
      title: "",
      date: formatNow(),
      tags: "26春训",
      category: "算法竞赛",
      excerpt: "",
      cfUrl: "",
      problemSeed: "",
      problems: []
    };

    function formatNow() {
      const now = new Date();
      const pad = (value) => String(value).padStart(2, "0");
      return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 1600);
    }

    function openUrl(url) {
      if (!url) {
        showToast("链接为空");
        return;
      }
      window.open(url, "_blank", "noopener,noreferrer");
    }

    function parseContestInfo(urlText) {
      const text = (urlText || "").trim();
      if (!text) return null;
      try {
        const url = new URL(text);
        const segments = url.pathname.split("/").filter(Boolean);
        const contestIndex = segments.indexOf("contest");
        if (contestIndex === -1 || contestIndex === segments.length - 1) {
          return { url: text, title: "", contestId: "" };
        }
        const contestId = segments[contestIndex + 1];
        const isGroup = segments.includes("group");
        const title = isGroup ? `⌈CF Group ${contestId}⌋ 题解` : `⌈CF ${contestId}⌋ 题解`;
        return { url: text, title, contestId };
      } catch (error) {
        return null;
      }
    }

    function sanitizeImportedProblemName(name) {
      let text = normalizeText(name);
      if (!text) {
        return "";
      }

      text = text
        .replace(/\s*standard input\/output.*$/i, "")
        .replace(/\s*time limit per test.*$/i, "")
        .replace(/\s*memory limit per test.*$/i, "")
        .replace(/\s*interactive.*$/i, "")
        .replace(/\s+/g, " ")
        .trim();

      return text;
    }

    function encodeImportPayload(payload) {
      return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
    }

    function decodeImportPayload(raw) {
      try {
        return JSON.parse(decodeURIComponent(escape(atob(raw))));
      } catch (error) {
        return null;
      }
    }

    function createProblem(problem = {}) {
      const fragment = document.getElementById("problem-template").content.cloneNode(true);
      const card = fragment.querySelector(".problem-card");
      card.querySelector(".problem-label").value = problem.label || "";
      card.querySelector(".problem-name").value = sanitizeImportedProblemName(problem.name || "");
      card.querySelector(".problem-tags").value = problem.tags || "";
      card.querySelector(".problem-note").value = problem.note || "";
      bindProblemCard(card);
      problemList.appendChild(card);
      refreshProblemMeta();
      generateMarkdown();
    }

    function bindProblemCard(card) {
      card.querySelectorAll("input, textarea").forEach((element) => {
        element.addEventListener("input", () => {
          refreshProblemMeta();
          generateMarkdown();
        });
      });

      card.querySelector(".remove-problem").addEventListener("click", () => {
        card.remove();
        refreshProblemMeta();
        generateMarkdown();
      });

      card.querySelector(".move-up").addEventListener("click", () => {
        const prev = card.previousElementSibling;
        if (prev) {
          problemList.insertBefore(card, prev);
          refreshProblemMeta();
          generateMarkdown();
        }
      });

      card.querySelector(".move-down").addEventListener("click", () => {
        const next = card.nextElementSibling;
        if (next) {
          problemList.insertBefore(next, card);
          refreshProblemMeta();
          generateMarkdown();
        }
      });
    }

    function refreshProblemMeta() {
      const cards = [...problemList.querySelectorAll(".problem-card")];
      cards.forEach((card, index) => {
        const fallback = String.fromCharCode(65 + (index % 26));
        const label = card.querySelector(".problem-label").value.trim() || fallback;
        const name = card.querySelector(".problem-name").value.trim();
        card.querySelector(".problem-badge").textContent = label;
        card.querySelector(".problem-heading").textContent = name ? `${label} · ${name}` : label;
      });
      problemCount.textContent = `题目数：${cards.length}`;
    }

    function normalizeText(text) {
      return (text || "").replace(/\r\n/g, "\n").trim();
    }

    function renderProblem(card) {
      const label = normalizeText(card.querySelector(".problem-label").value) || "A";
      const name = normalizeText(card.querySelector(".problem-name").value);
      const tags = normalizeText(card.querySelector(".problem-tags").value);
      const note = normalizeText(card.querySelector(".problem-note").value);

      const lines = [];
      lines.push(`#### ${label}${name ? ` ${name}` : ""}`);
      lines.push("");
      if (note) {
        lines.push(`**备注：** ${note}`);
        lines.push("");
      }
      lines.push("**题目大意：** ");
      lines.push("");
      lines.push("待补充。");
      lines.push("");
      lines.push(`**知识点：** ${tags || "待补充。"}`);
      lines.push("");
      lines.push("待补充。");
      lines.push("");
      lines.push("**Code:**");
      lines.push("");
      lines.push("```C++");
      lines.push("// TODO");
      lines.push("```");
      return lines.join("\n").replace(/\n{3,}/g, "\n\n");
    }

    function buildFrontMatter() {
      return [
        "---",
        `title: ${normalizeText(postTitle.value)}`,
        `date: ${normalizeText(postDate.value) || formatNow()}`,
        `tags: ${normalizeText(postTags.value)}`,
        `categories: ${normalizeText(postCategory.value)}`,
        `excerpt: ${normalizeText(postExcerpt.value)}`,
        "---"
      ].join("\n");
    }

    function collectState() {
      return {
        title: postTitle.value,
        date: postDate.value,
        tags: postTags.value,
        category: postCategory.value,
        excerpt: postExcerpt.value,
        cfUrl: cfUrl.value,
        problemSeed: problemSeed.value,
        problems: [...problemList.querySelectorAll(".problem-card")].map((card) => ({
          label: card.querySelector(".problem-label").value,
          name: card.querySelector(".problem-name").value,
          tags: card.querySelector(".problem-tags").value,
          note: card.querySelector(".problem-note").value
        }))
      };
    }

    function scheduleAutoSave() {
      clearTimeout(scheduleAutoSave.timer);
      scheduleAutoSave.timer = setTimeout(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(collectState()));
        saveStatus.textContent = "状态：已自动保存";
      }, 450);
    }

    function generateMarkdown() {
      const parts = [buildFrontMatter()];
      [...problemList.querySelectorAll(".problem-card")].forEach((card, index) => {
        parts.push("");
        if (index > 0) {
          parts.push("---");
          parts.push("");
        }
        parts.push(renderProblem(card));
      });
      const markdown = parts.join("\n").replace(/\n{3,}/g, "\n\n").trim() + "\n";
      output.value = markdown;
      charCount.textContent = `字符数：${markdown.length}`;
      saveStatus.textContent = "状态：已修改";
      scheduleAutoSave();
    }

    function applyState(state) {
      postTitle.value = state.title || "";
      postDate.value = state.date || formatNow();
      postTags.value = state.tags || "";
      postCategory.value = state.category || "";
      postExcerpt.value = state.excerpt || "";
      cfUrl.value = state.cfUrl || "";
      problemSeed.value = state.problemSeed || "";
      problemList.innerHTML = "";
      (state.problems || []).forEach((problem) => createProblem(problem));
      if ((state.problems || []).length === 0) {
        createProblem();
      } else {
        refreshProblemMeta();
        generateMarkdown();
      }
    }

    function importContestPayload(payload) {
      if (!payload) {
        showToast("导入失败");
        return;
      }

      const seed = (payload.problems || []).map((item) => item.label).join(",");
      applyState({
        title: payload.title || postTitle.value || "",
        date: formatNow(),
        tags: payload.tags || postTags.value || "26春训",
        category: payload.category || postCategory.value || "算法竞赛",
        excerpt: payload.excerpt || postExcerpt.value || "",
        cfUrl: payload.url || "",
        problemSeed: seed,
        problems: (payload.problems || []).map((item) => ({
          label: item.label || "",
          name: item.name || "",
          tags: "",
          note: item.note || ""
        }))
      });
      importBanner.classList.add("show");
      saveStatus.textContent = "状态：已导入比赛";
      showToast("已导入比赛");
    }

    function consumeImportPayload() {
      const hash = window.location.hash || "";
      const marker = "#import=";
      if (!hash.startsWith(marker)) {
        return;
      }
      const raw = hash.slice(marker.length);
      const payload = decodeImportPayload(raw);
      if (!payload) {
        showToast("导入数据损坏");
        return;
      }
      importContestPayload(payload);
      history.replaceState(null, "", window.location.pathname);
    }

    function saveDraft() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(collectState()));
      saveStatus.textContent = "状态：草稿已保存";
      showToast("已保存");
    }

    function loadDraft() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        applyState(defaultState);
        return;
      }
      try {
        applyState(JSON.parse(raw));
        saveStatus.textContent = "状态：已载入草稿";
      } catch (error) {
        console.error(error);
        applyState(defaultState);
      }
    }

    function resetAll() {
      if (!window.confirm("确定清空？")) return;
      localStorage.removeItem(STORAGE_KEY);
      applyState(defaultState);
      saveStatus.textContent = "状态：已清空";
      showToast("已清空");
    }

    async function copyMarkdown() {
      try {
        await navigator.clipboard.writeText(output.value);
      } catch (error) {
        output.select();
        document.execCommand("copy");
      }
      showToast("已复制");
    }

    function downloadMarkdown() {
      const filename = (postTitle.value.trim() || "review") + ".md";
      const blob = new Blob([output.value], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = filename;
      anchor.click();
      URL.revokeObjectURL(url);
      showToast("已下载");
    }

    async function savePost(openInTypora) {
      const title = postTitle.value.trim();
      if (!title) {
        showToast("先填标题");
        postTitle.focus();
        return;
      }

      const endpoint = openInTypora ? "/api/save-and-open" : "/api/save";
      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            title,
            content: output.value
          })
        });
        const result = await response.json();
        if (!response.ok || !result.ok) {
          throw new Error(result.error || "保存失败");
        }
        saveStatus.textContent = openInTypora ? "状态：已保存并打开" : "状态：已保存到 _posts";
        showToast(openInTypora ? "已保存并打开 Typora" : "已保存到 _posts");
      } catch (error) {
        console.error(error);
        showToast(error.message || "保存失败");
      }
    }

    function applyContestUrl() {
      const info = parseContestInfo(cfUrl.value);
      if (!info) {
        showToast("链接无效");
        return;
      }
      if (!postTitle.value.trim() || postTitle.value.includes("⌈CF")) {
        postTitle.value = info.title || postTitle.value;
      }
      if (!postTags.value.trim()) {
        postTags.value = "CF";
      }
      if (!postCategory.value.trim()) {
        postCategory.value = "算法竞赛";
      }
      generateMarkdown();
      showToast("已套用");
    }

    function seedProblemsFromInput() {
      const raw = problemSeed.value.trim();
      if (!raw) {
        showToast("先填题号");
        return;
      }
      problemList.innerHTML = "";
      raw.split(/[,\s，]+/).map((item) => item.trim()).filter(Boolean).forEach((label) => {
        createProblem({ label });
      });
      refreshProblemMeta();
      generateMarkdown();
      showToast("已生成题目");
    }

    function openContest() {
      const text = cfUrl.value.trim();
      if (!text) {
        showToast("先填链接");
        return;
      }
      openUrl(text);
    }

    function loadSample() {
      applyState({
        title: "⌈25暑训⌋ 第7,8场补题",
        date: "2025-08-08 14:42:47",
        tags: "26春训",
        category: "算法竞赛",
        excerpt: "两场全部打的依托……虽说早已出线无望，但越打状态越差还是很失望的。",
        cfUrl: "https://codeforces.com/group/sample/contest/123456",
        problemSeed: "7A,7D",
        problems: [
          {
            label: "7A",
            name: "",
            tags: "置换、逆序对",
            note: "思维题"
          },
          {
            label: "7D",
            name: "",
            tags: "dp",
            note: "图上 DP"
          }
        ]
      });
      saveStatus.textContent = "状态：已载入示例";
      showToast("示例已载入");
    }

    [postTitle, postDate, postTags, postCategory, postExcerpt, cfUrl, problemSeed].forEach((element) => {
      element.addEventListener("input", generateMarkdown);
    });

    document.getElementById("add-problem").addEventListener("click", () => createProblem());
    document.getElementById("save-draft").addEventListener("click", saveDraft);
    document.getElementById("load-sample").addEventListener("click", loadSample);
    document.getElementById("reset-all").addEventListener("click", resetAll);
    document.getElementById("copy-markdown").addEventListener("click", copyMarkdown);
    document.getElementById("save-post").addEventListener("click", () => savePost(false));
    document.getElementById("save-open-post").addEventListener("click", () => savePost(true));
    document.getElementById("download-markdown").addEventListener("click", downloadMarkdown);
    document.getElementById("apply-contest").addEventListener("click", applyContestUrl);
    document.getElementById("seed-problems").addEventListener("click", seedProblemsFromInput);
    document.getElementById("open-contest").addEventListener("click", openContest);

    loadDraft();
    consumeImportPayload();
    generateMarkdown();
  </script>
</body>
